<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROBE - static bilibili embed test</title>
<style>
  body { background:#0b1c2c; color:#dbeafe; font-family: system-ui, sans-serif; margin:0; padding:16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .player-box { width:100%; aspect-ratio:16/9; background:#000; }
  iframe { width:100%; height:100%; display:block; }
  p { line-height:1.6; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>探針頁 PROBE</h2>
  <p>成頁只有一個寫死喺 HTML 原始碼入面嘅 Bilibili iframe（唔經任何 JavaScript 建立），屬性跟 B 站官方分享嵌入代碼：無 referrerpolicy、無 lazy。影片：Yakka Dee S01E01 Banana（BV17598YWEup），網址為官方格式 isOutside=true。</p>
  <div class="player-box">
    <iframe src="https://player.bilibili.com/player.html?isOutside=true&bvid=BV17598YWEup&p=1&danmaku=0" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
  </div>
  <p>如果呢頁喺 iPhone Safari 播到、而主站播唔到，分別就在於 iframe 嘅交付方式（靜態 HTML ＋ 預設 referer）而唔係網址格式。</p>
</div>
</body>
</html>
