<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROBE4 - JS-created iframe, no-referrer, full params</title>
<style>
  body { background:#0b1c2c; color:#dbeafe; font-family: system-ui, sans-serif; margin:0; padding:16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .player-box { width:100%; aspect-ratio:16/9; background:#000; }
  iframe { width:100%; height:100%; display:block; }
  p { line-height:1.6; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>探針頁 4 PROBE4</h2>
  <p>呢頁模擬主站嘅交付方式：iframe 唔係寫死，係入頁之後由 JavaScript 即時建立，而且帶 referrerpolicy="no-referrer"（同主站現行寫法一樣）；唯一改動係條網址用齊完整官方參數 aid＋cid（Banana）。</p>
  <div class="player-box" id="box"></div>
  <p>如果呢頁播到，主站只需要改網址參數就修好，唔使改交付方式。</p>
</div>
<script>
  var f = document.createElement('iframe');
  f.src = 'https://player.bilibili.com/player.html?isOutside=true&aid=114093205749959&bvid=BV17598YWEup&cid=28657389464&p=1&danmaku=0';
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.setAttribute('allowfullscreen', 'true');
  f.setAttribute('allow', 'fullscreen; encrypted-media');
  f.setAttribute('scrolling', 'no');
  f.setAttribute('frameborder', 'no');
  document.getElementById('box').appendChild(f);
</script>
</body>
</html>
